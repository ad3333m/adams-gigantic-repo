<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adam's Gigantic Repo</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff;
         background: radial-gradient(circle at 30% 20%, #3b2a8a, #0d0b1a 70%); }
  main { width: 100%; max-width: 380px; padding: 28px 22px; border-radius: 24px; text-align: center;
         background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); backdrop-filter: blur(20px); }
  h1 { margin: 0 0 6px; font-size: 26px; }
  p { margin: 0 0 22px; opacity: .7; }
  a, button { display: block; width: 100%; box-sizing: border-box; margin: 10px 0; padding: 15px; border: 0; border-radius: 14px;
              font: inherit; font-size: 17px; font-weight: 600; color: #fff; text-decoration: none; cursor: pointer; }
  .alt { background: #7b5cff; } .side { background: #2c8a6f; } .copy { background: rgba(255,255,255,.14); }
</style>
</head>
<body>
<main>
  <h1>Adam's Gigantic Repo</h1>
  <p>44,000+ sideload apps from 300+ sources, Alan's Gigantic Repo included.</p>
  <a class="alt" href="altstore://source?url=https://raw.githubusercontent.com/ad3333m/adams-gigantic-repo/main/repo.json">Add to AltStore</a>
  <a class="side" href="sidestore://source?url=https://raw.githubusercontent.com/ad3333m/adams-gigantic-repo/main/repo.json">Add to SideStore</a>
  <button class="copy" onclick="navigator.clipboard.writeText('https://raw.githubusercontent.com/ad3333m/adams-gigantic-repo/main/repo.json').then(() => this.textContent = 'Copied!')">Copy source URL (Feather, ESign…)</button>
</main>
</body>
</html>
